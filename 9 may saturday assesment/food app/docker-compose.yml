services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_password123 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FoodOrdering.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FoodOrderingDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      Jwt__Issuer: "FoodOrdering.Api"
      Jwt__Audience: "FoodOrdering.Client"
      Jwt__Key: "CHANGE_ME_TO_A_64_CHARACTER_PRODUCTION_SECRET_KEY_1234567890"
      Cors__AllowedOrigins__0: "http://localhost:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000/api"
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sqlserver-data:
